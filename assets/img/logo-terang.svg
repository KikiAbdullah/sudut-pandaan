  <circle cx="50" cy="31" r="3.4" fill="#C79A00"/>
  <text x="32" y="45" text-anchor="middle" font-family="Manrope, system-ui, sans-serif" font-size="21" font-weight="700" fill="#071C53" letter-spacing="0.5">SP</text>
  <rect x="18" y="50" width="28" height="3" rx="1.5" fill="#C79A00" opacity=".9"/>
