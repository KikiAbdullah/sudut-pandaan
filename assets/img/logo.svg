<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Logo Sudut Pandaan">
  <title>Logo Sudut Pandaan</title>
  <defs>
    <linearGradient id="spBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2560"/>
      <stop offset="1" stop-color="#071C53"/>
    </linearGradient>
  </defs>
  <!-- latar navy (palet model indonesia.travel) -->
  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#spBg)"/>
  <!-- bukit Penanggungan -->
  <path d="M4 46 L22 26 L32 38 L42 24 L60 46 Z" fill="#2095AE" opacity=".55"/>
  <!-- busur "sudut" matahari -->
  <path d="M12 30 A20 20 0 0 1 52 30" fill="none" stroke="#E8B400" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="50" cy="31" r="3.4" fill="#E8B400"/>
  <!-- huruf SP -->
  <text x="32" y="45" text-anchor="middle" font-family="Manrope, system-ui, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">SP</text>
  <!-- garis dasar -->
  <rect x="18" y="50" width="28" height="3" rx="1.5" fill="#E8B400" opacity=".85"/>
</svg>
